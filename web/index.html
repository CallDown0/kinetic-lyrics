<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinetic Lyrics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Big+Shoulders+Display:wght@400..900&family=Instrument+Serif:ital@0;1&family=Martian+Mono:wght@400;600&family=Unbounded:wght@400..900&display=swap">
<style>
/* ---- motorun sahnesi (wallpaper/index.html ile aynı) ---- */
html,body{margin:0;height:100%;overflow:hidden;background:#0E0F12}
#cv,#bg3{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
:root{--u:clamp(9px,1.05vmin,26px);--gut:clamp(14px,2.6vmin,72px);--lift:clamp(28px,5.5vh,140px)}
#info,#st{transition:color .9s ease}
#info{position:fixed;left:var(--gut);bottom:var(--lift);display:flex;align-items:center;gap:calc(var(--u)*1.3);max-width:min(calc(var(--u)*48),62vw);font-family:"Martian Mono",Consolas,monospace;pointer-events:none}
#art{width:calc(var(--u)*5.2);height:calc(var(--u)*5.2);border-radius:calc(var(--u)*.4);object-fit:cover;flex:none;box-shadow:0 2px 12px rgba(0,0,0,.25)}
#info div{min-width:0}
#ti{font-size:calc(var(--u)*1.3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ar{font-size:calc(var(--u)*1.1);opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:calc(var(--u)*.3)}
#st{position:fixed;right:var(--gut);bottom:var(--lift);max-width:40vw;font-family:"Martian Mono",Consolas,monospace;font-size:var(--u);opacity:.65;text-align:right;pointer-events:none}
@media (max-aspect-ratio:9/10){
  #info{max-width:calc(100vw - 2*var(--gut))}
  #st{left:var(--gut);max-width:none;text-align:left;bottom:calc(var(--lift) + var(--u)*7.5)}
}

/* ---- oynatıcı arayüzü ---- */
#kl-ui{position:fixed;left:50%;top:14px;transform:translate(-50%,-8px);width:min(920px,calc(100vw - 32px));z-index:10;
  font:14px/1.3 "Segoe UI",system-ui,sans-serif;color:#eef0f3;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
body.kl-awake #kl-ui,body.kl-empty #kl-ui,#kl-ui:hover,#kl-ui:focus-within{opacity:1;transform:translate(-50%,0);pointer-events:auto}
body:not(.kl-awake):not(.kl-empty){cursor:none}
.kl-bar{display:flex;align-items:center;gap:8px;padding:8px;border-radius:14px;background:rgba(14,15,18,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.kl-bar+.kl-bar{margin-top:8px}
#kl-form{display:flex;flex:1;gap:8px;min-width:0}
#kl-q{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:9px;color:inherit;
  padding:9px 12px;font:inherit;outline:none}
#kl-q:focus{border-color:rgba(124,196,255,.7)}
.kl-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:inherit;border-radius:9px;padding:8px 12px;
  font:inherit;cursor:pointer;white-space:nowrap}
.kl-btn:hover{background:rgba(255,255,255,.15)} .kl-btn:disabled{opacity:.5;cursor:default}
.kl-pri{background:#2f7de1;border-color:#2f7de1} .kl-pri:hover{background:#3a8bf0}
.kl-ico{width:38px;padding:8px 0;text-align:center}
#kl-now{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85;font-size:13px}
#kl-seek{flex:2;min-width:80px;accent-color:#7cc4ff}
#kl-vol{width:80px;accent-color:#7cc4ff}
#kl-time{font-variant-numeric:tabular-nums;font-size:12.5px;opacity:.75;white-space:nowrap}
.kl-pop{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,calc(100vw - 32px));max-height:min(70vh,640px);overflow:auto;
  padding:12px;border-radius:14px;background:rgba(14,15,18,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.09);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.kl-pop h3{margin:2px 2px 10px;font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;opacity:.6}
.kl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 2px;border-top:1px solid rgba(255,255,255,.06);font-size:13px}
.kl-row select{max-width:52%;background:#1c1f25;color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:4px 6px;font:inherit}
.kl-row input[type=range]{width:46%;accent-color:#7cc4ff}
.kl-row input[type=checkbox]{width:18px;height:18px;accent-color:#7cc4ff}
.kl-wide{width:100%;margin-top:10px}
.kl-hi{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;font-size:13px;padding:8px 6px;
  border-radius:7px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kl-hi:hover{background:rgba(255,255,255,.08)}
.kl-muted{opacity:.6;font-size:13px;padding:6px}
#kl-busy,#kl-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:11;padding:9px 16px;border-radius:10px;
  background:rgba(14,15,18,.85);color:#eef0f3;font:13px "Segoe UI",system-ui,sans-serif;border:1px solid rgba(255,255,255,.1)}
#kl-toast{bottom:68px}
#kl-hello{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:5}
body.kl-empty #kl-hello{display:flex}
#kl-hello{align-items:flex-end!important}
#kl-hello div{margin-bottom:calc(var(--lift) + 64px);padding:10px 18px;border-radius:12px;background:rgba(14,15,18,.55);text-align:center;
  color:rgba(238,240,243,.85);font:15px/1.6 "Segoe UI",system-ui,sans-serif;max-width:calc(100vw - 32px)}
body.kl-drop::after{content:"Bırak: ses dosyası ya da YouTube bağlantısı";position:fixed;inset:16px;border:2px dashed rgba(124,196,255,.8);
  border-radius:18px;display:flex;align-items:center;justify-content:center;color:#eef0f3;font:600 18px "Segoe UI",system-ui,sans-serif;
  background:rgba(14,15,18,.55);z-index:20;pointer-events:none}
@media (max-width:640px){ #kl-vol,#kl-now{display:none} }
</style>
</head>
<body class="kl-empty">
<canvas id="bg3" hidden></canvas>
<canvas id="cv"></canvas>
<div id="info" hidden><img id="art" alt=""><div><div id="ti"></div><div id="ar"></div></div></div>
<div id="st" hidden></div>

<div id="kl-ui">
  <div class="kl-bar">
    <form id="kl-form" autocomplete="off">
      <input id="kl-q" type="search" placeholder="YouTube bağlantısı ya da şarkı adı" aria-label="YouTube bağlantısı ya da şarkı adı">
      <button id="kl-go" class="kl-btn kl-pri" type="submit">Çal</button>
    </form>
    <button id="kl-open" class="kl-btn" type="button" title="Bilgisayardan ses dosyası">Dosya…</button>
    <input id="kl-file" type="file" accept="audio/*,video/mp4,video/webm" hidden>
  </div>
  <div class="kl-bar" style="position:relative">
    <button id="kl-play" class="kl-btn kl-ico" type="button">▶</button>
    <span id="kl-now"></span>
    <input id="kl-seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="Konum">
    <span id="kl-time">0:00 / 0:00</span>
    <input id="kl-vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Ses" title="Ses">
    <button id="kl-histb" class="kl-btn kl-ico" type="button" title="Son çalınanlar">☰</button>
    <button id="kl-gear" class="kl-btn kl-ico" type="button" title="Ayarlar">⚙</button>
    <a class="kl-btn kl-ico" href="/panel" target="_blank" title="Senkron izleme paneli" style="text-decoration:none">◎</a>
    <button id="kl-fs" class="kl-btn kl-ico" type="button" title="Tam ekran (F)">⛶</button>
    <div id="kl-setp" class="kl-pop" hidden><h3>Ayarlar</h3><div id="kl-set"></div></div>
    <div id="kl-histp" class="kl-pop" hidden><h3>Son çalınanlar</h3><div id="kl-hist"></div></div>
  </div>
</div>
<div id="kl-hello"><div>YouTube bağlantısı ya da şarkı adı yaz, veya bir ses dosyasını buraya sürükle.<br>
Sözler LRCLIB'den gelir; her kelime sesten senkronlanır, sözü olmayan şarkıda sözler sesten çıkarılır.</div></div>
<div id="kl-busy" hidden></div>
<div id="kl-toast" hidden></div>

<script src="player.js"></script>
<script src="gsap.min.js"></script>
<script src="three.bundle.js"></script>
<script src="fonts.js"></script>
<script src="kinetik.js"></script>
</body>
</html>
